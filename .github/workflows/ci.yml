name: CI and npm publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publish_ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      - name: Check npm initialization
        id: readiness
        if: github.event_name != 'pull_request'
        run: node scripts/publish-readiness.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.publish_ready == 'true'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pi-extensions-npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      # Read the latest main after acquiring the queue slot. Registry content
      # fingerprints include any commits accumulated while this run waited.
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Verify archives and publish changed packages in dependency order
        run: pnpm release
        env:
          # Temporary credential for the first publication only. Existing
          # packages use OIDC once npm Trusted Publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Sync confirmed release versions to main
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync npm release versions"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
        # GITHUB_TOKEN pushes do not trigger another workflow. Fingerprints
        # also exclude version and receipt metadata to avoid release loops.
